{% extends "index.html" %}

    {% load static %}

    {% block contenidoQueCambia %}
        <h3 style="color:white;">CURSOS</h3>

        {% if cursos %}
            {% for curso in cursos %}
                <p style="color: aliceblue;">{{curso.nombre}} ---- {{curso.camada}}</p>
            {% endfor %}    
        {% else %}
            <p>No hay cursos disponibles</p>
        {% endif %}

    {% endblock %}
